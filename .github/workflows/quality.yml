name: FOCUS quality checks

on:
  push:
    branches:
      - main
      - "refactor/**"
  pull_request:
    branches:
      - main
      - "refactor/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run dependency-free integrity tests
        run: npm test
